<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUCI · Layered Unified Computational Interfaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--k:#000;--c:#fff3e7;--o:#ff7b10;--c2:rgba(255,243,231,.68);--c3:rgba(255,243,231,.45);--ln:rgba(255,243,231,.16);--ln2:rgba(255,243,231,.3);--ot:rgba(255,123,16,.13);
--fd:'Unbounded','Trebuchet MS',system-ui,sans-serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif;--fm:'JetBrains Mono',Consolas,monospace;
--leaf:22px 4px 22px 4px;--am:#ffb02e;--g:#3ddc84;--r:#ff5c5c;--b:#5cc8ff;--p:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--c);font:14px/1.5 var(--fb)}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh;min-height:560px}
/* sidebar */
.side{display:flex;flex-direction:column;padding:18px 18px 14px 14px;border-right:1px solid var(--ln);position:relative;min-height:0;background:radial-gradient(120% 40% at 0% 100%,rgba(255,123,16,.16),transparent 70%),#000}
.logobtn{background:none;border:0;padding:0;align-self:center;display:block;cursor:pointer;max-width:100%;transition:filter .2s}
.logobtn:hover{filter:brightness(1.15)}
.app.home{grid-template-columns:1fr}.app.home .side{display:none}
.app:not(.home) .side{animation:slidein .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateX(-36px)}}
.landing.home-wrap{max-width:1240px}
.hero{display:flex;align-items:center;gap:30px;margin-bottom:10px}.hero img{width:210px;flex:none}
.laygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.pchip{background:transparent;border:1px solid var(--ln2);border-radius:12px 3px 12px 3px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--c);transition:all .18s}
.pchip:hover{background:var(--ot);border-color:var(--o);color:var(--o)}
.pchip.s-ok{border-color:var(--g);color:var(--g)}.pchip.s-update{border-color:var(--b);color:var(--b)}
.pchip.s-blocked{border-color:var(--r);color:var(--r)}.pchip.s-pending{border-style:dashed;color:var(--c3)}
.legend{margin-top:6px}
.logo{width:236px;max-width:100%;align-self:center;display:block;margin:-4px 0 6px}
.stack{flex:1;min-height:0;overflow:auto;padding:20px 32px 16px 24px;position:relative}
.stack::before{content:"";position:absolute;left:9px;top:36px;bottom:32px;width:1px;background:linear-gradient(var(--o),rgba(255,123,16,.1))}
.stack::-webkit-scrollbar{width:0}
.nav-item{position:relative;isolation:isolate;margin:9px 0;padding:12px 30px 12px 26px;cursor:pointer;user-select:none;transition:transform .28s cubic-bezier(.3,1.4,.5,1),filter .28s}
.nav-item::before,.nav-item::after{content:"";position:absolute;z-index:-1;clip-path:polygon(0 50%,6% 0,94% 0,100% 50%,94% 100%,6% 100%)}
.nav-item::before{inset:0;background:var(--ln2)}
.nav-item::after{inset:1px;background:#000;transition:background .25s}
.nav-item:hover:not(.sel){transform:translateX(8px)}
.nav-item:hover:not(.sel)::before{background:var(--o)}
.nt{font:600 12px var(--fd);letter-spacing:.02em}
.nc{font-size:11.5px;color:var(--c3);margin-top:2px}
.dot{position:absolute;left:-21px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#000;border:1.5px solid var(--o);transition:all .28s}
.nav-item.sel{transform:translateX(16px);filter:drop-shadow(0 0 16px rgba(255,123,16,.5))}
.nav-item.sel::before,.nav-item.sel::after{background:var(--o)}
.nav-item.sel .nt,.nav-item.sel .nc{color:#000}
.nav-item.sel .dot{background:var(--o);left:-37px;box-shadow:0 0 0 4px var(--ot),0 0 12px var(--o)}
.nav-item.dim .nt,.nav-item.dim .nc{opacity:.35}
.navtoggle{display:none;align-items:center;justify-content:space-between;width:100%;max-width:440px;background:transparent;border:1px solid var(--o);border-radius:16px 3px 16px 3px;padding:10px 16px;font:600 12px var(--fd);}
.navtoggle em{font:800 11.5px var(--fb);font-style:normal;color:var(--o)}
.menus{display:flex;gap:4px;padding:8px 0 0 10px;font-size:12px;color:var(--c3)}
.m{position:relative;padding:3px 8px;border-radius:6px;cursor:default}
.m:hover{color:var(--c);background:var(--ot)}
.dd{display:none;position:absolute;bottom:26px;left:0;background:#000;border:1px solid var(--ln2);border-radius:12px 3px 12px 3px;padding:4px;min-width:170px;z-index:30}
.m:hover .dd{display:block}
.dd div{padding:6px 10px;border-radius:6px;white-space:nowrap;color:var(--c)}
.dd div:hover{background:var(--o);color:#000}
.dd hr{border:0;border-top:1px solid var(--ln);margin:4px 2px}
/* main */
.right{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;isolation:isolate;overflow:hidden}
.right::before{content:"";position:absolute;inset:-35%;z-index:-1;pointer-events:none;background:radial-gradient(28% 24% at 70% 30%,rgba(255,123,16,.14),transparent 70%),radial-gradient(24% 22% at 30% 72%,rgba(255,176,46,.08),transparent 70%),radial-gradient(20% 18% at 55% 55%,rgba(255,92,92,.05),transparent 70%);transform:rotate(var(--rot,0deg));transition:transform 1.4s cubic-bezier(.3,.7,.2,1);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{translate:-3% -2%}to{translate:4% 3%}}
.filterbar{display:flex;gap:18px;align-items:center;padding:18px 36px;border-bottom:1px solid rgba(255,176,46,.4);background:linear-gradient(90deg,rgba(255,176,46,.13),rgba(255,176,46,.02) 75%);flex:none;flex-wrap:wrap}
.fl{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.fl b{font:600 13px var(--fd);color:var(--am);text-shadow:0 0 14px rgba(255,176,46,.55)}
.fl span{font-size:12px;color:var(--c2)}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fchip{background:rgba(255,176,46,.06);color:var(--am);border:1.5px solid rgba(255,176,46,.6);border-radius:20px;padding:8px 18px;font-size:13px;font-weight:800;transition:all .2s;display:inline-flex;gap:8px;align-items:center}
.fchip:hover{background:rgba(255,176,46,.18)}
.fchip.on{background:var(--am);color:#000;border-color:var(--am)}
.linkbtn{background:none;border:0;color:var(--am);font-size:12.5px;font-weight:800;padding:4px 6px}
.linkbtn:hover{text-decoration:underline}
.content{flex:1;overflow:auto;min-height:0}
.content::-webkit-scrollbar,.chat::-webkit-scrollbar,.console::-webkit-scrollbar,.pkg-body::-webkit-scrollbar{width:10px}
.content::-webkit-scrollbar-thumb,.chat::-webkit-scrollbar-thumb,.console::-webkit-scrollbar-thumb,.pkg-body::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:5px;border:2px solid #000}
.landing{padding:34px 36px 190px;max-width:1040px;display:flex;flex-direction:column;gap:14px}
.pageTitle{font:800 32px/1.1 var(--fd);margin:0;letter-spacing:-.01em;position:relative;isolation:isolate}
.pageTitle::before{content:"";position:absolute;left:-70px;top:50%;width:min(620px,100%);height:190px;transform:translateY(-50%);background:radial-gradient(closest-side,rgba(255,123,16,.7),rgba(255,123,16,.22) 55%,transparent);filter:blur(12px);z-index:-1;pointer-events:none}
.pageSub{color:var(--c2);font-size:15px;margin:8px 0 14px;max-width:62ch}
.card{border:1px solid var(--ln);border-radius:var(--leaf);padding:18px 22px;display:flex;flex-direction:column;gap:9px;position:relative;transition:border-color .2s,background .2s}
.card::before{content:"";position:absolute;left:-1px;top:22px;bottom:22px;width:3px;background:var(--sc,var(--o));border-radius:2px;transform:scaleY(0);transition:transform .25s}
.card:nth-child(even){border-radius:4px 22px 4px 22px}
.card.s-ok{--sc:var(--g)}.card.s-update{--sc:var(--b)}.card.s-blocked{--sc:var(--r)}.card.s-pending{--sc:var(--c3)}
.card:hover{border-color:var(--ln2);background:rgba(255,123,16,.04)}
.card:hover::before{transform:scaleY(1)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cardTitle{font:600 17px var(--fd);}
.cardBody{color:var(--c2);max-width:78ch}
.cardNote{color:var(--c3);font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:10px;padding:1px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--ln2);color:var(--c2)}
.chip.loop{border-color:var(--p);color:var(--p);background:rgba(180,140,255,.1)}
.pill{border-radius:11px;padding:2px 10px;font-size:11.5px;font-weight:800;border:1px solid;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.ok{background:var(--g);color:#03200e;border-color:var(--g)}
.pill.missing{color:var(--c2);border-color:var(--ln2)}
.pill.update{color:var(--b);border-color:var(--b);background:rgba(92,200,255,.1)}
.pill.blocked{color:var(--r);border-color:var(--r);background:rgba(255,92,92,.1)}
.pill.pending{color:var(--c3);border:1px dashed var(--ln2)}
@keyframes blink{50%{opacity:.2}}
.btns{display:flex;gap:8px;margin-top:4px}
.b{background:transparent;border:1px solid var(--ln2);border-radius:12px 3px 12px 3px;padding:5px 16px;min-height:30px;font-size:12.5px;font-weight:800;transition:all .18s}
.b:hover{border-color:var(--o);color:var(--o)}
.b.primary,.b.run{background:var(--o);color:#000;border-color:var(--o)}
.b.primary:hover,.b.run:hover{background:var(--c);border-color:var(--c);color:#000}
.b.stop{border-color:var(--r);color:var(--r)}.b.stop:hover{background:var(--r);color:#000}
.b.small{font-size:12px;min-height:28px;padding:4px 13px}
.b:disabled{opacity:.3;cursor:default;background:transparent;color:var(--c);border-color:var(--ln)}
.hiddenNote{color:var(--c3);font-size:12.5px}
/* program */
.pkg{display:flex;flex-direction:column;height:100%;min-height:0}
.pkg-head{display:flex;align-items:center;gap:8px;padding:16px 36px 4px;flex:none}.sp{flex:1}
.pkg-body{flex:1;overflow:auto;min-height:0}
.intro{padding:14px 36px 0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.caption{color:var(--c2);max-width:80ch}
.banner{border-radius:var(--leaf);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;width:100%;max-width:1040px;border:1px solid var(--o);background:var(--ot)}
.banner.err{border-color:var(--r);background:rgba(255,92,92,.08)}
.banner.info{border-color:var(--ln2);background:transparent;color:var(--c2)}
.banner .x{flex:1}
.form{max-width:1040px;padding:8px 36px 190px;display:flex;flex-direction:column;gap:4px}
.group{border:1px solid var(--ln);border-radius:var(--leaf);margin-top:16px;padding:20px 18px 12px;position:relative}
.gt{position:absolute;top:-11px;left:18px;padding:0 8px;background:#000;color:var(--o);font:600 12px var(--fd);cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;text-shadow:0 0 14px rgba(255,123,16,.9)}
.ch{font-size:8px;transition:transform .15s}
.group.closed{padding:12px 18px 6px}.group.closed .ch{transform:rotate(-90deg)}.group.closed>.gb{display:none}
.row{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:12px;align-items:center;margin:9px 0}
.rl{font-weight:800;color:var(--c2)}
.field{background:#000;border:1px solid var(--ln2);border-radius:14px 3px 14px 3px;padding:8px 12px;min-height:36px;color:var(--c);font:inherit;width:100%;outline:none}
.field:focus{border-color:var(--o);box-shadow:0 0 0 3px var(--ot)}
.field::placeholder{color:var(--c3)}
.mono{font-family:var(--fm);font-size:12.5px}
.combo{position:relative}.combo select{appearance:none;-webkit-appearance:none;font-weight:600;padding-right:42px;cursor:pointer}
.combo::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;margin-top:-6px;border:solid var(--o);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
.help{width:26px;height:26px;border-radius:50%;background:transparent;border:1px solid var(--ln2);font-size:12px;font-weight:800;padding:0;color:var(--c2)}
.help:hover{background:var(--o);color:#000;border-color:var(--o)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.tpill{background:transparent;border:1px solid var(--ln2);border-radius:18px;padding:7px 16px;font-weight:600;font-size:12.5px}
.tpill:hover{border-color:var(--o)}.tpill.on{background:var(--o);color:#000;border-color:var(--o)}
.pathrow{display:flex;gap:8px}.pathrow .field{flex:1}
.check{border:1px dashed var(--ln2);border-radius:16px 3px 16px 3px;padding:12px 16px;margin:8px 0 2px;display:flex;flex-direction:column;gap:8px}
.cs{font-weight:800;color:var(--g)}.cd{color:var(--c2);font-size:13px}
.cbx{display:inline-flex;align-items:center;gap:8px;color:var(--c2);font-size:12.5px;cursor:pointer;user-select:none}
.cbx i{width:18px;height:18px;border:1px solid var(--ln2);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#000;font-weight:900}
.cbx.on i{background:var(--o);border-color:var(--o)}
.issues{width:100%;border-collapse:collapse;font-size:12.5px}.issues td{padding:5px 8px;border-bottom:1px solid var(--ln)}
.preview{border:1px solid var(--ln2);border-radius:14px 3px 14px 3px;padding:10px 12px;font:12.5px var(--fm);word-break:break-all;white-space:pre-wrap}
.split{height:1px;background:var(--ln);margin:0 36px;flex:none}
.consolebox{flex:none;height:200px;padding:10px 190px 14px 36px;display:flex;flex-direction:column;gap:8px}
.lbl{font:600 12px var(--fd);display:flex;align-items:center;gap:12px}
.progress{flex:1;max-width:260px;height:4px;background:var(--ln);border-radius:2px;overflow:hidden;display:none}
.progress>div{height:100%;width:0;background:var(--o);box-shadow:0 0 10px var(--o);transition:width .3s}
.console{flex:1;border-left:2px solid var(--o);background:rgba(255,243,231,.04);border-radius:3px 14px 3px 14px;font:12.5px/1.6 var(--fm);padding:10px 14px;overflow:auto;white-space:pre-wrap}
.console .ph{color:var(--c3)}.console .ok{color:var(--g)}.console .y{color:var(--am)}.console .bl{color:var(--c3)}
.statusbar{height:28px;color:var(--c3);font:11.5px var(--fm);display:flex;align-items:center;padding:0 36px;border-top:1px solid var(--ln);flex:none}
.statusbar::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--o);margin-right:10px;box-shadow:0 0 8px var(--o)}
/* assistant */
.robotWrap{position:fixed;right:30px;bottom:44px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:20}
.robot{background:#000;border:2.5px solid var(--o);border-radius:50%;padding:0;width:90px;height:90px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 14px rgba(255,123,16,.35));animation:bob 4s ease-in-out infinite}
.robot svg{width:82%;height:82%;display:block}
.robot:hover{animation:wave .7s ease-in-out}
.robot.busy{animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 0 28px var(--o))}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wave{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.ctlrow{display:flex;align-items:center;gap:8px}
.switch{width:32px;height:18px;border-radius:9px;border:1px solid var(--o);position:relative;cursor:pointer;background:#000}
.switch::after{content:"";position:absolute;top:2px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--c);transition:left .15s}
.switch.on{background:var(--o)}.switch.on::after{left:17px;background:#000}
.ctl{font:600 9px var(--fd);letter-spacing:.08em;color:var(--c3)}
.assistant{position:fixed;right:150px;bottom:30px;width:420px;max-width:calc(100% - 480px);height:min(560px,calc(100% - 90px));background:#000;border:1px solid var(--o);border-radius:26px 4px 26px 4px;box-shadow:0 0 40px rgba(255,123,16,.18);padding:14px 16px;display:none;flex-direction:column;gap:10px;z-index:19}
.assistant.open{display:flex}
.ahead{display:flex;align-items:center;gap:6px}.tt{flex:1}
.t1{font:600 14px var(--fd)}.t2{color:var(--c3);font-size:11.5px}
.hb{min-width:30px;height:30px;padding:0 12px!important;font-size:12px;font-weight:800;border-radius:10px 2px 10px 2px;background:transparent;border:1px solid var(--ln2);color:var(--c2);display:flex;align-items:center;justify-content:center;padding:0}
.hb:hover{border-color:var(--o);color:var(--o)}.hb.on{background:var(--o);border-color:var(--o);color:#000}
.chat{flex:1;border-top:1px solid var(--ln);padding:12px 2px 0;overflow:auto;display:flex;flex-direction:column;gap:10px;line-height:1.5}
.bub{max-width:88%;padding:9px 13px}
.bub.user{align-self:flex-end;background:var(--o);color:#000;border-radius:16px 16px 3px 16px;font-weight:600}
.bub.bot{align-self:flex-start;border:1px solid var(--ln2);border-radius:16px 16px 16px 3px;color:var(--c)}
.bub b.h{color:var(--o)}.bub code{font-family:var(--fm);color:var(--o);font-size:12px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg a{border:1px solid var(--ln2);padding:5px 12px;border-radius:14px;font-size:12.5px;font-weight:600;cursor:pointer}
.sugg a:hover{border-color:var(--o);color:var(--o)}
.arow{display:flex;gap:8px}
.arow textarea{flex:1;height:62px;resize:none;background:#000;color:var(--c);border:1px solid var(--ln2);border-radius:14px 3px 14px 3px;padding:8px 12px;font:inherit;outline:none}
.arow textarea:focus{border-color:var(--o)}
.acol{display:flex;flex-direction:column;gap:6px}
.mic,.send{width:78px;flex:1;font-size:12.5px;font-weight:800;border-radius:10px 2px 10px 2px;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;border:1px solid var(--ln2)}
.send{background:var(--o);border-color:var(--o);color:#000}.send:hover{background:var(--c)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
 .side{padding:14px 16px 12px;border-right:0;border-bottom:1px solid var(--ln);align-items:center;gap:10px;position:sticky;top:0;z-index:25;background:#000}
 .logo{width:150px;margin:0}
 .navtoggle{display:flex}
 .stack{display:none;position:absolute;top:100%;left:0;right:0;background:#000;border-bottom:1px solid var(--o);padding:18px 26px 18px 36px;max-height:70vh;box-shadow:0 24px 40px #000}
 .stack.open{display:block;animation:drop .25s ease-out}
 @keyframes drop{from{opacity:0;transform:translateY(-8px)}}
 .stack::before{left:20px}
 .nav-item.sel{transform:translateX(8px)}
 .menus{display:none}
 .robotWrap{position:fixed;right:10px;bottom:14px;z-index:20}.robot{width:64px;height:64px}
 .assistant{left:10px;right:10px;width:auto;max-width:none;bottom:120px;z-index:26}
 .filterbar{padding:14px 16px;gap:10px}
 .landing,.intro,.form,.pkg-head,.statusbar,.consolebox{padding-left:16px;padding-right:16px}
 .row{grid-template-columns:1fr auto}.row .rl{grid-column:1/-1}
 .pageTitle{font-size:24px}
 .hero{flex-direction:column;text-align:center;gap:6px}.hero img{width:170px}.laygrid{grid-template-columns:1fr}.pkg-head{flex-wrap:wrap}
}
</style></head>
<body>

<script>

const LAYERS=[
 {k:"struct",t:"LUCI-STRUCT",d:"3D structures",desc:"Generate and optimize 3D structures: conformer ensembles, optimized geometries and metal complexes.",label:"Structures"},
 {k:"thermo",t:"LUCI-THERMO",d:"Energies",desc:"Energies and thermochemistry: ZPE, enthalpy, entropy, free energies and formation energies.",label:"Thermochemistry"},
 {k:"react",t:"LUCI-REACT",d:"Transition states",desc:"Transition states, reaction paths and energy profiles from reactions.",label:"Reactivity"},
 {k:"feat",t:"LUCI-FEAT",d:"Descriptors",desc:"Molecular descriptors (electronic, steric, DFT) ready for modeling.",label:"Descriptors"},
 {k:"pred",t:"LUCI-PRED",d:"Models and predictions",desc:"Machine-learning models trained on your data, and their predictions.",label:"Models"},
 {k:"design",t:"LUCI-DESIGN",d:"Next experiments",desc:"Which experiments to run next: Bayesian optimization of conditions and substrate scope selection, round after round.",label:"Experiment design"},
];
const INPUTS={smiles:"SMILES",structures:"3D structures",qm_output:"QM outputs",reaction:"Reactions",table:"CSV / tables"};
const ST={ok:"Installed",missing:"Not installed",update:"Update available",blocked:"Linux / WSL only",pending:"Coming soon"};
const P=[
 {k:"aqme_csearch",n:"AQME CSEARCH",l:"struct",d:"Conformer generation with RDKit or CREST.",i:["smiles","structures"],s:"ok"},
 {k:"aqme_cmin",n:"AQME CMIN",l:"struct",d:"Geometry optimization of conformers with xTB or machine-learned potentials (ANI, UMA).",i:["structures"],s:"update"},
 {k:"molsimplify",n:"MolSimplify",l:"struct",d:"3D structures of transition-metal complexes from a metal and its ligands.",i:[],s:"missing"},
 {k:"goodvibes",n:"GoodVibes",l:"thermo",d:"Thermochemistry from frequency calculations, with quasi-harmonic corrections, Boltzmann weighting and energy profiles.",i:["qm_output"],s:"ok"},
 {k:"thermomlip",n:"ThermoMLIP",l:"thermo",d:"From SMILES to ZPE, H, S and G: conformer search, MLIP (UMA) optimization and frequencies in one run.",i:["smiles"],s:"missing"},
 {k:"thermognn",n:"universal_thermoGNN",l:"thermo",d:"Gibbs formation energy predicted from SMILES by an evidential graph neural network, with uncertainty.",i:["smiles"],s:"missing"},
 {k:"ts_tools",n:"TS-tools",l:"react",d:"Automated transition-state search from atom-mapped reaction SMILES: TS guess, optimization and IRC validation. Method: xTB, g-xTB or MLIP.",i:["reaction"],s:"blocked"},
 {k:"aqme_qdescp",n:"AQME QDESCP",l:"feat",d:"xTB electronic and steric descriptors, Boltzmann-averaged over conformers.",i:["smiles","structures"],s:"ok"},
 {k:"dbstep",n:"DBSTEP",l:"feat",d:"Steric descriptors from 3D structures: Sterimol L/Bmin/Bmax, percent buried volume and steric maps.",i:["structures"],s:"update"},
 {k:"autoqchem",n:"Auto-QChem",l:"feat",d:"DFT descriptors: parse Gaussian outputs locally, or generate conformers and run Gaussian on a cluster.",i:["smiles","qm_output"],s:"blocked"},
 {k:"robert",n:"ROBERT",l:"pred",d:"Automated machine-learning workflow: curation, model screening, validation, predictions and a PDF report.",i:["table"],s:"ok"},
 {k:"edboplus",n:"EDBO+",l:"design",d:"Bayesian optimization of reaction conditions for one or more objectives (yield, selectivity, cost...).",i:["table"],s:"missing",loop:1},
 {k:"scopebo",n:"ScopeBO",l:"design",d:"Substrate-scope selection: suggests which substrates to run next so the scope is both representative and high-yielding.",i:["smiles","table"],s:"missing",loop:1},
 {k:"boreact",n:"BoReact",l:"design",d:"Desktop interface for Bayesian optimization of experiments from a campaign CSV.",i:["table"],s:"pending",loop:1},
];
let layer=0, have=new Set(), openProg=null, running=false, home=true;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function renderNav(){
  $("#nav").innerHTML=LAYERS.map((L,i)=>{
    const progs=P.filter(p=>p.l===L.k), shown=progs.filter(match).length;
    const cap=have.size?`${shown} of ${progs.length} match`:L.d;
    const dim=have.size&&shown===0&&i!==layer;
    return `<div class="nav-item ${i===layer?"sel":""} ${dim?"dim":""}" data-i="${i}" title="${L.desc}"><i class="dot"></i><div class="nt">${L.t}</div><div class="nc">${cap}</div></div>`}).join("");
  document.querySelectorAll(".nav-item").forEach(e=>e.onclick=()=>{home=false;layer=+e.dataset.i;openProg=null;render()});
}
function renderChips(){
  $("#chips").innerHTML=Object.entries(INPUTS).map(([k,v])=>`<button class="fchip ${have.has(k)?"on":""}" data-k="${k}">${v}</button>`).join("")+(have.size?`<button class="linkbtn" id="clr">Clear</button>`:"");
  document.querySelectorAll(".fchip").forEach(b=>b.onclick=()=>{have.has(b.dataset.k)?have.delete(b.dataset.k):have.add(b.dataset.k);render()});
  const c=$("#clr"); if(c)c.onclick=()=>{have.clear();render()};
}
function match(p){return !have.size||!p.i.length||p.i.some(x=>have.has(x))}
function card(p){
  const tags=(p.i.length?p.i.map(x=>`<span class="chip input">${INPUTS[x]}</span>`).join(""):`<span class="chip input">No input file</span>`)+(p.loop?`<span class="chip loop">Iterative loop</span>`:"");
  const inst=p.s==="missing"||p.s==="update", installed=p.s==="ok"||p.s==="update";
  return `<div class="card s-${p.s}"><div class="top"><span class="cardTitle">${p.n}</span><span class="pill ${p.s}">${ST[p.s]}</span></div>
  <div class="cardBody">${p.d}</div><div class="tags">${tags}</div>
  ${p.s==="pending"?`<div class="cardNote">Waiting for the authors to make the code public.</div>`:""}
  <div class="btns"><button class="b primary" data-open="${p.k}">Open</button>${inst?`<button class="b">${p.s==="update"?"Update":"Install"}</button>`:""}${installed?`<button class="b">Uninstall</button>`:""}</div></div>`;
}
function renderLanding(){
  const L=LAYERS[layer], progs=P.filter(p=>p.l===L.k), shown=progs.filter(match), hidden=progs.length-shown.length;
  $("#content").innerHTML=`<div class="landing"><h1 class="pageTitle">${L.t}</h1><p class="pageSub">${L.desc}</p>
  ${shown.map(card).join("")}
  ${hidden?`<div class="hiddenNote">${hidden} program${hidden>1?"s":""} hidden: ${hidden>1?"they need":"it needs"} other inputs. <button class="linkbtn" id="showall">Show all</button></div>`:""}</div>`;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openProg=b.dataset.open;render()});
  const sa=$("#showall"); if(sa)sa.onclick=()=>{have.clear();render()};
}
function group(title,body,closed){return `<div class="group ${closed?"closed":""}"><div class="gt"><span class="ch">&#9660;</span>${title}</div><div class="gb">${body}</div></div>`}
function row(label,field,docs){return `<div class="row"><div class="rl">${label}</div><div>${field}</div><button class="help ${docs?"docs":""}" title="${docs?"Open the program's documentation":"What is this?"}">${docs?"i":"?"}</button></div>`}
function combo(opts){return `<div class="combo"><select class="field">${opts.map(o=>`<option>${o}</option>`).join("")}</select></div>`}
function inp(ph,val,mono){return `<input class="field ${mono?"mono":""}" placeholder="${ph||""}" value="${val||""}">`}
function pathf(ph,val){return `<div class="pathrow"><input class="field" placeholder="${ph}" value="${val||""}"><button class="b small">Browse</button></div>`}

function renderProgram(){
  const p=P.find(x=>x.k===openProg), L=LAYERS.find(x=>x.k===p.l);
  const isCS=p.k==="aqme_csearch";
  const modes=p.i.length?p.i.flatMap(x=>x==="smiles"?["Molecules (CSV)","One SMILES"]:[INPUTS[x]==="CSV / tables"?"CSV table":INPUTS[x]]):[];
  let input="";
  if(modes.length){
    input=row("Input",`<div class="pills">${modes.map((m,i)=>`<button class="tpill ${i===0?"on":""}">${m}</button>`).join("")}</div>`,true)
    +row("File",pathf("Molecules (CSV) - drop here or click to browse",isCS?"C:/Users/javie/Projects/ligands/ligands_set_A.csv":""));
    if(isCS) input+=`<div class="check"><div class="cs">&#10003; 24 molecules ready</div><div class="cd">Columns found: <span class="mono">smiles</span>, <span class="mono">code_name</span>, <span class="mono">charge</span>. 2 rows need a look:</div>
      <table class="issues"><tr><td style="color:var(--am)">Row 7</td><td>code_name <span class="mono">L-07</span> is repeated (also row 3)</td></tr><tr><td style="color:var(--am)">Row 19</td><td>Empty SMILES cell</td></tr></table>
      <div style="display:flex;gap:14px;align-items:center"><span class="cbx on"><i>&#10003;</i>Leave out the 2 with errors</span><span class="cbx"><i></i>Problems only</span><button class="b small">Check again</button></div></div>`;
  } else input=`<div class="cardNote" style="margin:4px 0 8px">No input file: fill in the options below.</div>`;
  input+=row("Output folder",pathf(isCS?"Next to the input: ligands/csearch_output":"Next to the input"));
  const method=isCS?group("Method",row("Method",combo(["RDKit","CREST (Linux)"]))):"";
  const core=isCS?group("Core options",row("Charge",inp("Auto (from SMILES)"))+row("Multiplicity",inp("Auto"))+row("Number of conformers",inp("25","50"))+row("Constraints",inp("[[1,2,1.8]]","",true)))
    :group("Options",row("Option A",combo(["Default","Alternative"]))+row("Option B",inp("auto"))+row("Option C",inp("e.g. 10")));
  const extra=isCS?group("CREST extras","",true):"";
  const adv=group("Advanced flags",`<div class="cardNote" style="margin-bottom:6px">Other options that the program accepts.</div>`+inp("--seed 42 --max_workers 4","",true),true);
  const cmd=isCS?"luci struct aqme_csearch --molecules ligands_set_A.csv --program rdkit --sample 50 --skip-invalid":`luci ${p.l} ${p.k} ...`;
  const prev=group("Command preview",`<div class="preview">${cmd}</div><div style="margin-top:8px"><button class="b small">Copy command</button></div>`,true);
  let banner="";
  if(p.s==="missing") banner=`<div class="banner warn"><div class="x"><b>${p.n} is not installed.</b> LUCI installs it in its own environment; it takes a few minutes the first time.</div><button class="b primary">Install</button></div>`;
  if(p.s==="update") banner=`<div class="banner warn"><div class="x"><b>Update available.</b> This environment now includes Open Babel for the 3D-structure inputs.</div><button class="b primary">Update</button></div>`;
  if(p.s==="blocked") banner=`<div class="banner err"><div class="x"><b>Linux only.</b> This program needs Linux; on Windows, run LUCI inside WSL.</div></div>`;
  if(p.s==="pending") banner=`<div class="banner info"><div class="x"><b>Not available yet.</b> Waiting for the authors to make the code public.</div></div>`;
  const canRun=p.s==="ok"||p.s==="update";
  $("#content").innerHTML=`<div class="pkg">
   <div class="pkg-head"><button class="b small" id="back">Back</button><div class="sp"></div>${p.s==="ok"||p.s==="update"?`<button class="b small">Uninstall</button><span style="width:12px"></span>`:""}<button class="b run" id="run" ${canRun?"":"disabled"}>Run</button><button class="b stop" id="stop" disabled>Stop</button></div>
   <div class="pkg-body"><div class="intro"><div class="tr"><h1 class="pageTitle">${p.n}</h1><span class="pill ${p.s}">${ST[p.s]}</span></div>
     <div class="caption">${L.t} · ${p.d}</div>${banner}</div>
     <div class="form">${group(modes.length?"Input and output":"Output",input)}${method}${core}${extra}${adv}${prev}</div></div>
   <div class="split"></div>
   <div class="consolebox"><div class="lbl">Execution console <div class="progress" id="prog"><div></div></div></div><div class="console" id="console"><span class="ph">Output of the run appears here.</span></div></div>
  </div>`;
  $("#back").onclick=()=>{if(!running){openProg=null;render()}};
  document.querySelectorAll(".gt").forEach(g=>g.onclick=()=>g.parentElement.classList.toggle("closed"));
  document.querySelectorAll(".pills").forEach(ps=>ps.querySelectorAll(".tpill").forEach(b=>b.onclick=()=>{ps.querySelectorAll(".tpill").forEach(x=>x.classList.remove("on"));b.classList.add("on")}));
  document.querySelectorAll(".cbx").forEach(c=>c.onclick=()=>{c.classList.toggle("on");c.querySelector("i").innerHTML=c.classList.contains("on")?"&#10003;":""});
  $("#run").onclick=()=>fakeRun(p);
}
const timers=[];
function fakeRun(p){
  if(running)return; running=true;
  const con=$("#console"), run=$("#run"), stop=$("#stop"), prog=$("#prog");
  run.disabled=true; stop.disabled=false; prog.style.display="block"; con.innerHTML="";
  $("#robot").classList.add("busy");
  $("#status").textContent=`Running ${p.n}...`;
  const lines=[
   `<span class="bl">$ luci ${p.l} ${p.k} --molecules ligands_set_A.csv --sample 50 --skip-invalid</span>`,
   `Checking input... 24 molecules, 2 with errors (left out: L-07, row 19)`,
   `Environment <span class="y">aqme</span> ready (pixi, frozen lock)`,
   `o  Starting CSEARCH with RDKit`,
   ...Array.from({length:8},(_,i)=>`   L-${String(i+1).padStart(2,"0")}: ${20+((i*7)%31)} conformers kept`),
   `   ...`,
   `<span class="ok">Finished: 22 of 22 molecules gave conformers.</span>`,
   `Results in ligands/csearch_output/  (SDF + CSEARCH_data.dat)`,
  ];
  let i=0; stop.onclick=()=>finish(true);
  function step(){ if(!running)return;
    con.innerHTML+=(i?"\n":"")+lines[i]; con.scrollTop=con.scrollHeight;
    prog.firstElementChild.style.width=Math.round((i+1)/lines.length*100)+"%";
    i++; if(i<lines.length) timers.push(setTimeout(step,380)); else finish(false);}
  function finish(stopped){
    timers.forEach(clearTimeout); running=false; run.disabled=false; stop.disabled=true;
    $("#robot").classList.remove("busy");
    if(stopped) con.innerHTML+=`\n<span style="color:var(--r)">Stopped by the user.</span>`;
    $("#status").textContent=stopped?"Stopped":"Ready - "+LAYERS[layer].t;
    setTimeout(()=>prog.style.display="none",800);
  }
  step();
}
function render(){
  renderNav(); renderChips();
  $("#filterbar").style.display=openProg?"none":"flex";
  openProg?renderProgram():renderLanding();
  if(!running)$("#status").textContent="Ready - "+LAYERS[layer].t;
}
render();

/* assistant mock */
const chat=$("#chat");
function bot(html,sugg){chat.insertAdjacentHTML("beforeend",`<div class="bub bot">${html}</div>`+(sugg?`<div class="sugg">${sugg.map(s=>`<a>${s}</a>`).join("")}</div>`:""));chat.scrollTop=chat.scrollHeight;bindSugg()}
function user(t){chat.insertAdjacentHTML("beforeend",`<div class="bub user">${esc(t)}</div>`);chat.scrollTop=chat.scrollHeight}
function bindSugg(){chat.querySelectorAll(".sugg a").forEach(a=>a.onclick=()=>ask(a.textContent))}
bot(`<b class="h">Hi, I'm LUNA.</b><br>I can explain any program in LUCI, check your input files and, with <b>CONTROL</b> on, fill the forms and press Run for you.`,["Which program gives me free energies?","Is my CSV ready for CSEARCH?","What does Sterimol measure?"]);
function ask(q){
  user(q); chat.querySelectorAll(".sugg").forEach(s=>s.remove());
  $("#robot").classList.add("busy");
  setTimeout(()=>{ $("#robot").classList.remove("busy");
    if(/free energ|energ/i.test(q)) bot(`For free energies go to <b>LUCI-THERMO</b>:<br>· <b>GoodVibes</b> if you already have frequency calculations (<code>.log</code>/<code>.out</code>).<br>· <b>ThermoMLIP</b> if you only have SMILES: it does conformers, UMA optimization and frequencies in one run.`);
    else if(/csv|ready/i.test(q)) bot(`I checked <code>ligands_set_A.csv</code>: 24 rows with <code>smiles</code> and <code>code_name</code>. Two need a look: <b>L-07</b> is repeated and row 19 has no SMILES. With "Leave out the 2 with errors" ticked, the other 22 will run.`);
    else bot(`Sterimol (in <b>DBSTEP</b>, LUCI-FEAT) describes a substituent's shape with three lengths: <b>L</b> along the bond axis, and <b>B1</b>/<b>B5</b> as the minimum and maximum widths perpendicular to it.`);
  },700);
}
$("#robot").onclick=()=>$("#assistant").classList.toggle("open");
$("#aclose").onclick=()=>$("#assistant").classList.remove("open");
$("#web").onclick=e=>e.currentTarget.classList.toggle("on");
$("#ctl").onclick=e=>{const on=e.currentTarget.classList.toggle("on");$("#asub").textContent=on?"Control ON · can drive the window":"Control OFF · explains and checks"};
$("#asend").onclick=()=>{const v=$("#ain").value.trim();if(v){$("#ain").value="";ask(v)}};
$("#ain").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#asend").click()}};

const tg=$("#navtoggle"),nv=$("#nav"),_render=render;
tg.onclick=()=>{const o=nv.classList.toggle("open");tg.classList.toggle("open",o);tg.setAttribute("aria-expanded",o);tg.lastElementChild.textContent=o?"Close":"Menu"};
function renderHome(){
 const lg=document.querySelector(".logo").src;
 $("#content").innerHTML=`<div class="landing home-wrap"><div class="hero"><img src="${lg}" alt="LUCI"><div><h1 class="pageTitle">Choose a layer</h1><p class="pageSub">Each layer is one step of the workflow. Open a layer to see its programs, or go straight to one.</p></div></div>
 <div class="laygrid">${LAYERS.map((L,i)=>{const ps=P.filter(p=>p.l===L.k);return `<div class="card lay"><div class="top"><span class="cardTitle">${L.t}</span><span class="cardNote">${ps.length} program${ps.length>1?"s":""}</span></div><div class="cardBody">${L.desc}</div><div class="plist">${ps.map(p=>`<button class="pchip s-${p.s}" data-p="${p.k}" title="${ST[p.s]}">${p.n}</button>`).join("")}</div><div class="btns"><button class="b primary" data-l="${i}">Open layer</button></div></div>`}).join("")}</div>
 <div class="tags legend">${Object.entries(ST).map(([k,v])=>`<span class="pill ${k}">${v}</span>`).join("")}</div></div>`;
 document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{home=false;layer=+b.dataset.l;openProg=null;render()});
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const p=P.find(x=>x.k===b.dataset.p);home=false;layer=LAYERS.findIndex(l=>l.k===p.l);openProg=p.k;render()});
}
render=function(){
 document.querySelector(".app").classList.toggle("home",home);
 if(home){renderHome();$("#filterbar").style.display="none";$("#status").textContent="Home";$(".right").style.setProperty("--rot","0deg");return}
 _render();tg.firstElementChild.textContent=LAYERS[layer].t+" · "+LAYERS[layer].d;nv.classList.remove("open");tg.classList.remove("open");tg.lastElementChild.textContent="Menu";$(".right").style.setProperty("--rot",layer*55+"deg");
};
$("#homebtn").onclick=()=>{if(!running){home=true;openProg=null;render()}};
render();

</script>
