# Builds the Windows executable of LUCI when a tag vX.Y.Z is pushed (see publicar.ps1) and
# publishes it as a GitHub release: LUCI_windows.zip + version.json (what the "Update LUCI"
# button of the program reads). The OpenAI key is NOT part of this build: the assistant stays
# grey until the user adds a key in Tools > Settings.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version from the tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Bad tag: ${{ github.ref_name }}" }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          foreach ($item in @(@("src/luci/__init__.py", '(?m)^__version__ = ".*"$', "__version__ = `"$version`""),
                              @("pyproject.toml", '(?m)^version = ".*"$', "version = `"$version`""))) {
            $path = Join-Path $PWD $item[0]
            $text = [IO.File]::ReadAllText($path)
            $new = [regex]::Replace($text, $item[1], $item[2])
            if ($new -eq $text -and $text -notmatch [regex]::Escape($item[2])) { throw "Version line not found in $($item[0])" }
            [IO.File]::WriteAllText($path, $new, $utf8)
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller pytest

      - name: Tests of the updater
        run: python -m pytest tests/test_updater.py -q

      - name: Build (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean packaging/luci.spec

      - name: Check the build and the absence of any key
        shell: pwsh
        run: |
          foreach ($f in "dist/LUCI/LUCI.exe", "dist/LUCI/luci-cli.exe", "dist/LUCI/_internal") {
            if (-not (Test-Path $f)) { throw "Missing in the build: $f" }
          }
          if (Get-ChildItem dist/LUCI -Recurse -Filter bundled_key.txt) { throw "A bundled key got into the build" }

      - name: Zip and manifest
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LUCI -DestinationPath dist/LUCI_windows.zip -Force
          $zip = Get-Item dist/LUCI_windows.zip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $notes = (git log -1 --format=%b).Trim()
          $manifest = [ordered]@{ version = $env:VERSION; file = "LUCI_windows.zip"; sha256 = $hash; size = $zip.Length; notes = $notes }
          $json = $manifest | ConvertTo-Json
          [IO.File]::WriteAllText((Join-Path $PWD "dist/version.json"), $json, (New-Object System.Text.UTF8Encoding($false)))
          $notes | Out-File -FilePath dist/notes.txt -Encoding utf8
          Get-Content dist/version.json

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist/LUCI_windows.zip dist/version.json --title "LUCI $env:VERSION" --notes-file dist/notes.txt --latest
