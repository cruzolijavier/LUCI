# ScopeBO: mirrors the authors' environment.yml (Python 3.9, torch 1.10 CPU).
# The code is imported from ./src (cloned by LUCI), it is not a package.
[workspace]
name = "luci-scopebo"
channels = ["conda-forge", "pytorch", "IDAES-PSE"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.9.*"
pip = "*"
pytorch = { version = "==1.10.2", channel = "pytorch" }
cpuonly = { version = "==2.0", channel = "pytorch" }
# torch 1.10 breaks with MKL >= 2024.1 ("undefined symbol: iJIT_NotifyEvent").
mkl = "<2024.1"
botorch = "==0.5.1"
gpytorch = "==1.8.1"
numpy = "==1.23.5"
pandas = "==1.3.5"
scipy = "1.12.*"
scikit-learn = "==1.6.1"
rdkit = "==2023.03.3"
morfeus-ml = "==0.7.2"
mordred = "==1.2.0"
xtb-python = "==22.1"
umap-learn = "==0.5.3"
shap = "==0.40.0"
matplotlib = "==3.5.1"
seaborn = "==0.11.2"
tqdm = "*"
adjusttext = "==1.3.0"
geometric = "==1.1"
qcengine = "==0.32.0"
# Imported at the top of Code/predictor.py (pysmo sampling) and for notebooks' display.
idaes-pse = { version = "==1.13.0", channel = "IDAES-PSE" }
pyomo = "==6.5.0"
ipython = "*"

[pypi-dependencies]
vendi-score = "==0.0.3"
