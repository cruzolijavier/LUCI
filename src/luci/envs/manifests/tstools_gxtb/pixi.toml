# TS-tools g-xTB fork: same stack, the g-xTB binary is set in LUCI Settings.
[workspace]
name = "luci-tstools-gxtb"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
pip = "*"
pandas = "1.4.*"
pebble = "*"
xtb = ">=6.3,<6.8"
tqdm = "*"
rdkit = "*"
xyz2mol = "*"
autode = "1.4.*"

[pypi-dependencies]
fortranformat = "*"

[tasks]
postinstall = "python -m pip install --no-deps -e src && chmod +x src/xtb_external_script/xtb_external.py"
