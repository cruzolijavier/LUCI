# ThermoMLIP: Linux only (fcntl, Linux compilers). Cloned into ./src by LUCI.
[workspace]
name = "luci-thermomlip"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
numba = ">=0.55"
cython = ">=0.29.30"
setuptools = ">=65"
wheel = "*"
rdkit = "*"
networkx = ">=2.6"
c-compiler = "*"
cxx-compiler = "*"

[pypi-dependencies]
torch = ">=2.6"
ase = ">=3.20"
pyscf = ">=2.0"
fairchem-core = "*"

[tasks]
postinstall = "python -m pip install --no-deps --no-build-isolation -e src"
